<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fudy — Diario low-FODMAP</title>

  <!-- PWA iOS & Android Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fudy">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html,
    body {
      height: 100%;
      overscroll-behavior-y: none;
    }

    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 4.5rem);
    }

    header {
      padding-top: calc(env(safe-area-inset-top) + 0.5rem) !important;
    }

    .bottom-nav {
      padding-bottom: calc(env(safe-area-inset-bottom) + 0.35rem);
    }
  </style>
</head>

<body class="text-gray-800 antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <!-- Banner Notifica Aggiornamento PWA -->
  <div id="pwa-update-banner"
    class="hidden fixed top-0 left-0 right-0 z-50 bg-emerald-700 text-white px-4 py-2.5 shadow-lg flex justify-between items-center text-xs">
    <div class="flex items-center gap-2">
      <span class="text-base">🚀</span>
      <span><strong>Nuova versione disponibile!</strong> Tocca per aggiornare l'app.</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="pwa-update-btn"
        class="bg-white text-emerald-800 font-bold px-3 py-1 rounded-md shadow-xs active:scale-95 transition-transform">
        Aggiorna
      </button>
      <button id="pwa-dismiss-btn" class="text-emerald-200 hover:text-white px-1.5 py-1 text-sm font-bold">
        ✕
      </button>
    </div>
  </div>

  <!-- Header Sticky Principale -->
  <header
    class="bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 px-4 py-2.5 flex justify-between items-center shadow-xs">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🌱</span>
      <span>
        <h1 class="text-base font-extrabold text-emerald-700 tracking-tight leading-none">Fudy</h1>
      </span>
    </div>
    <div class="flex items-center gap-2">
      <a href="#onboarding"
        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-full font-semibold transition-colors flex items-center gap-1">
        <span>⚙️</span>
        <span class="hidden sm:inline">Profilo</span>
      </a>
    </div>
  </header>

  <!-- Contenitore Principale per le rotte (#app-root) -->
  <main id="app-root" class="min-h-[calc(100vh-8rem)]">
    <!-- Le viste vengono iniettate dinamicamente dal router -->
  </main>

  <!-- Bottom Navigation Bar Fissa per Mobile / PWA -->
  <nav
    class="bottom-nav fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 z-50 flex justify-around items-center py-2 px-1 shadow-lg">
    <a href="#home" data-route="home"
      class="flex flex-col items-center justify-center flex-1 py-1 text-emerald-600 font-bold transition-all">
      <span class="text-xl leading-none">📖</span>
      <span class="text-[10px] mt-1">Diario</span>
    </a>
    <a href="#alimenti" data-route="alimenti"
      class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 font-normal transition-all">
      <span class="text-xl leading-none">🥦</span>
      <span class="text-[10px] mt-1">Inserisci</span>
    </a>
    <a href="#challenge" data-route="challenge"
      class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 font-normal transition-all">
      <span class="text-xl leading-none">🧪</span>
      <span class="text-[10px] mt-1">Challenge</span>
    </a>
    <a href="#progressi" data-route="progressi"
      class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 font-normal transition-all">
      <span class="text-xl leading-none">📊</span>
      <span class="text-[10px] mt-1">Progressi</span>
    </a>
    <a href="#onboarding" data-route="onboarding"
      class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 font-normal transition-all">
      <span class="text-xl leading-none">👤</span>
      <span class="text-[10px] mt-1">Profilo</span>
    </a>
  </nav>

  <!-- Scripts Gestione PWA e Service Worker Update -->
  <script>
    let newWorker = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((registration) => {
          console.log('[SW] Registrato con successo:', registration.scope);

          // Rileva aggiornamento se un nuovo worker è già in attesa
          if (registration.waiting) {
            newWorker = registration.waiting;
            showUpdateBanner();
          }

          // Rileva quando viene trovato un nuovo service worker
          registration.addEventListener('updatefound', () => {
            const installingWorker = registration.installing;
            if (installingWorker) {
              installingWorker.addEventListener('statechange', () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker = installingWorker;
                  showUpdateBanner();
                }
              });
            }
          });
        }).catch((err) => console.warn('[SW] Errore di registrazione:', err));

        // Ricarica la pagina non appena il nuovo service worker prende il controllo
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }

    function showUpdateBanner() {
      const banner = document.getElementById('pwa-update-banner');
      if (banner) banner.classList.remove('hidden');
    }

    document.getElementById('pwa-update-btn')?.addEventListener('click', () => {
      if (newWorker) {
        newWorker.postMessage({ type: 'SKIP_WAITING' });
      }
    });

    document.getElementById('pwa-dismiss-btn')?.addEventListener('click', () => {
      const banner = document.getElementById('pwa-update-banner');
      if (banner) banner.classList.add('hidden');
    });
  </script>

  <!-- Caricamento del Router come modulo ES -->
  <script type="module">
    import { initRouter } from './src/ui/router.js';
    initRouter();
  </script>
</body>

</html>
